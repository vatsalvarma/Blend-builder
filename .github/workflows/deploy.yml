name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Run vitest and sweep
      run: |
        npm install
        npx vitest run
        npx tsx src/engine/sweep.ts

    - name: Export Seed
      run: npx tsx scripts/export-seed.ts

    - name: Build Frontend
      run: VITE_API=http npm run build

    - name: Copy Frontend to Backend
      run: |
        rm -rf backend/src/main/resources/static
        cp -r dist backend/src/main/resources/static

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Backend Tests and Package
      run: |
        cd backend
        ./mvnw test package

    - name: Deploy Placeholder
      run: echo "Deploy the jar to your server and hit the health check here!"
